<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Player Stock Exchange</title>
    <!-- Tailwind CSS for Layout Architecture -->
    <script src="https://tailwindcss.com"></script>
    <style>
        /* Official Premier League Palette Design Anchors */
        :root {
            --pl-purple: #3d195d;
            --pl-dark-purple: #1f0833;
            --pl-neon-green: #00ff87;
            --pl-pink: #ff007f;
            --pl-text-light: #ffffff;
        }
        body {
            background-color: var(--pl-dark-purple);
            color: var(--pl-text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .pl-bg-purple { background-color: var(--pl-purple); }
        .pl-text-green { color: var(--pl-neon-green); }
        .pl-text-pink { color: var(--pl-pink); }
        .pl-btn-green { background-color: var(--pl-neon-green); color: var(--pl-dark-purple); font-weight: bold; }
        .pl-btn-green:hover { background-color: #02e077; }
        .pl-border-green { border-color: var(--pl-neon-green); }
        .nav-item-active { color: var(--pl-neon-green) !important; font-weight: 900; position: relative; }
        .nav-item-active::after { content: ''; position: absolute; bottom: -12px; left: 0; right: 0; height: 3px; background-color: var(--pl-neon-green); }
        
        .candle-body { width: 12px; transition: all 0.2s ease; position: relative; }
        .candle-wick { width: 2px; background-color: #6b7280; position: absolute; left: 50%; transform: translateX(-50%); z-index: 0; }
        .candle-rect { position: absolute; width: 100%; left: 0; z-index: 10; border-radius: 1px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Global Broadcast Alerts Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2 pointer-events-none"></div>

    <!-- AUTHENTICATION PAGE PORTAL -->
    <div id="auth-page" class="flex-grow flex items-center justify-center px-4">
        <div class="w-full max-w-md p-8 rounded-xl pl-bg-purple shadow-2xl border border-gray-800">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-extrabold tracking-tight">PL <span class="pl-text-green">STOCK EXCHANGE</span></h1>
                <p class="text-gray-300 mt-2 text-sm">Log in using your secure team access credentials</p>
            </div>
            
            <div class="mb-6">
                <label class="block text-xs uppercase tracking-wider text-gray-400 mb-2 font-bold">Access Role</label>
                <div class="grid grid-cols-2 gap-2">
                    <button id="role-manager" onclick="setRole('manager')" class="py-2.5 rounded-lg font-bold text-sm bg-purple-900 border-2 pl-border-green text-white">Manager Account</button>
                    <button id="role-admin" onclick="setRole('admin')" class="py-2.5 rounded-lg font-bold text-sm bg-gray-800 text-gray-400">System Admin</button>
                </div>
            </div>

            <div class="space-y-4">
                <div>
                    <label id="user-label" class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-bold">Manager Name / Identifier</label>
                    <input type="text" id="auth-username" class="w-full p-3 rounded-lg bg-black/40 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-green-400" placeholder="e.g. Gaffer One">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-400 mb-1 font-bold">Security Password</label>
                    <input type="password" id="auth-password" class="w-full p-3 rounded-lg bg-black/40 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:border-green-400" placeholder="••••••••">
                </div>
                <button id="btn-login" onclick="handleLogin()" class="w-full py-3 rounded-lg pl-btn-green transition mt-2 shadow-lg">Enter Exchange Floor</button>
                <p id="auth-error" class="text-sm font-semibold text-center text-red-400 hidden mt-2">❌ Invalid password credentials provided.</p>
            </div>
        </div>
    </div>

    <!-- MAIN APP DASHBOARD INTERFACE -->
    <div id="main-app" class="hidden flex flex-col min-h-screen">
        <header class="pl-bg-purple border-b border-purple-900 px-4 py-3 sticky top-0 z-50 shadow-md">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-4">
                    <div>
                        <span class="text-[9px] uppercase font-bold tracking-widest pl-text-green block" id="display-role">Manager Portal</span>
                        <h2 class="text-base font-black text-white tracking-tight" id="display-name">Workspace</h2>
                    </div>
                </div>

                <nav class="flex items-center space-x-6 text-xs uppercase tracking-wider font-bold">
                    <button onclick="switchTab('market')" id="tab-market" class="text-gray-300 hover:text-white transition pb-1 nav-item-active">📈 Market</button>
                    <button onclick="switchTab('portfolio')" id="tab-portfolio" class="text-gray-300 hover:text-white transition pb-1">💼 Portfolio</button>
                    <button onclick="switchTab('fixtures')" id="tab-fixtures" class="text-gray-300 hover:text-white transition pb-1">🗓️ Fixtures</button>
                    <button onclick="switchTab('standings')" id="tab-standings" class="text-emerald-400 hover:text-emerald-300 transition pb-1">🏆 Standings</button>
                    <button onclick="switchTab('admin')" id="tab-admin" class="text-pink-400 hover:text-pink-300 transition pb-1 hidden">🛡️ Admin</button>
                </nav>

                <div class="flex items-center space-x-4">
                    <div class="text-right">
                        <span class="text-[10px] uppercase text-gray-400 font-medium block">Balance</span>
                        <span class="text-sm font-mono font-bold text-white"><span class="pl-text-green">🪙</span> <span id="wallet-balance">100,000</span></span>
                    </div>
                    <button id="btn-logout" onclick="handleLogout()" class="bg-black/40 hover:bg-black/60 px-2.5 py-1 text-[11px] font-bold rounded border border-purple-800 transition text-gray-300">Exit</button>
                </div>
            </div>
        </header>

        <main class="flex-grow max-w-7xl w-full mx-auto p-4 sm:p-6">
            <!-- SECTION 1: PLAYER MARKET -->
            <section id="view-market" class="space-y-6">
                <div class="bg-purple-950/40 p-4 rounded-xl border border-purple-900/60 flex flex-col md:flex-row md:items-center gap-4 justify-between">
                    <div class="relative flex-grow max-w-md">
                        <span class="absolute left-3.5 top-3.5 text-gray-400 text-sm">🔍</span>
                        <input type="text" id="search-player" oninput="filterAndRenderMarket()" class="w-full pl-10 pr-4 py-2.5 rounded-lg bg-black/40 border border-gray-800 text-sm focus:outline-none focus:border-green-400 text-white" placeholder="Search registry by player name or club...">
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-xs uppercase font-bold tracking-wider text-gray-400">Sort Matrix:</span>
                        <select id="filter-price" onchange="filterAndRenderMarket()" class="p-2.5 rounded-lg bg-black/40 border border-gray-800 text-sm focus:outline-none text-white font-medium bg-purple-950">
                            <option value="all">Display All Players</option>
                            <option value="expensive">Highest Valued First</option>
                            <option value="cheapest">Lowest Valued First</option>
                        </select>
                    </div>
                </div>

                <div id="chart-drawer" class="hidden bg-black/60 border border-purple-500/30 rounded-xl p-6 space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-xs font-mono uppercase tracking-wider text-gray-400">Advanced Analytics</span>
                            <h3 id="chart-player-title" class="text-xl font-black text-white">Performance Chart</h3>
                        </div>
                        <button onclick="closeChartDrawer()" class="text-xs font-bold text-pink-400 border border-pink-900/40 px-3 py-1 rounded bg-pink-950/20 hover:bg-pink-950/60 transition">✕ Close</button>
                    </div>
                    <div class="bg-purple-950/20 border border-purple-900/40 p-4 rounded-lg">
                        <div class="h-48 w-full flex items-end justify-start space-x-6 overflow-x-auto pt-6 border-b border-gray-800 pb-2 relative" id="candlestick-canvas"></div>
                        <div class="flex justify-between text-[10px] text-gray-500 font-mono mt-2">
                            <span>⏮️ Historic Matchweeks</span>
                            <span>Timeline Axis</span>
                            <span>Latest Close ⏭️</span>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="market-grid"></div>
            </section>

            <!-- SECTION 2: PORTFOLIO -->
            <section id="view-portfolio" class="hidden space-y-6">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div class="lg:col-span-2 space-y-4">
    <!-- REAL-TIME FIREBASE STORAGE ENGINE AND TRANSACTION ROUTERS -->
    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getDatabase, ref, set, update, onValue, get } from "https://gstatic.com";

        // Structured Firebase Configuration Realtime Credentials
        const firebaseConfig = {
            apiKey: "AIzaSyBz_ccCPcBD4hAtaECNEMVty1soRXHta8E",
            authDomain: "://firebaseapp.com",
            databaseURL: "https://firebaseio.com",
            projectId: "player-stock-exchange",
            storageBucket: "player-stock-exchange.firebasestorage.app",
            messagingSenderId: "271132576003",
            appId: "1:271132576003:web:fb251f5fb304f2cae38136",
            measurementId: "G-JD2GJ1DQ49"
        };

        // Core App Memory States
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentRole = 'manager';
        let currentUser = null;
        let globalPlayers = {};
        let globalFixtures = {};
        let globalManagers = {};

        const SECURITY_KEYS = {
            admin: "man_c1ty@Lunje",
            manager: "idk123"
        };

        const PREM_TEAMS = [
            "Arsenal", "Aston Villa", "Bournemouth", "Brentford", "Brighton", 
            "Chelsea", "Crystal Palace", "Everton", "Fulham", "Ipswich", 
            "Leicester", "Liverpool", "Man City", "Man United", "Newcastle", 
            "Nottingham Forest", "Southampton", "Tottenham", "West Ham", "Wolves"
        ];

        // Access Role Matrix Swapping
        window.setRole = function(role) {
            currentRole = role;
            document.getElementById('auth-error').classList.add('hidden');
            document.getElementById('role-manager').className = role === 'manager' ? 'py-2.5 rounded-lg font-bold text-sm bg-purple-900 border-2 pl-border-green text-white' : 'py-2.5 rounded-lg font-bold text-sm bg-gray-800 text-gray-400';
            document.getElementById('role-admin').className = role === 'admin' ? 'py-2.5 rounded-lg font-bold text-sm bg-pink-900 border-2 border-pink-500 text-white' : 'py-2.5 rounded-lg font-bold text-sm bg-gray-800 text-gray-400';
            document.getElementById('user-label').innerText = role === 'admin' ? 'Admin Access Identifier' : 'Manager Name / Identifier';
        };

        // Authorization Authentication Core Routing
        window.handleLogin = function() {
            const usernameInput = document.getElementById('auth-username').value.trim();
            const passwordInput = document.getElementById('auth-password').value;
            const errorElement = document.getElementById('auth-error');

            if (!usernameInput) {
                showToast("⚠️ Identification string required.", "pink");
                return;
            }

            if (passwordInput !== SECURITY_KEYS[currentRole]) {
                errorElement.innerText = `❌ Invalid security credentials for ${currentRole === 'admin' ? 'System Admin' : 'Manager Account'}.`;
                errorElement.classList.remove('hidden');
                return;
            }

            errorElement.classList.add('hidden');
            currentUser = usernameInput;
            document.getElementById('display-role').innerText = currentRole === 'admin' ? 'System Admin Portal' : 'Manager Workspace';
            document.getElementById('display-name').innerText = currentUser;

            if (currentRole === 'admin') {
                document.getElementById('tab-admin').classList.remove('hidden');
            } else {
                document.getElementById('tab-admin').classList.add('hidden');
            }

            if (currentRole === 'manager') {
                const managerRef = ref(db, `managers/${currentUser}`);
                get(managerRef).then((snapshot) => {
                    if (!snapshot.exists()) {
                        set(managerRef, {
                            name: currentUser,
                            balance: 100000,
                            portfolio: {},
                            shorts: {}
                        });
                    }
                });
            }

            document.getElementById('auth-page').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            showToast(`✨ Authenticated successfully as ${currentUser}`, "green");
            switchTab('market');
        };

        window.handleLogout = function() {
            currentUser = null;
            document.getElementById('auth-username').value = '';
            document.getElementById('auth-password').value = '';
            document.getElementById('auth-page').classList.remove('hidden');
            document.getElementById('main-app').classList.add('hidden');
        };

        window.switchTab = function(tabName) {
            const tabs = ['market', 'portfolio', 'fixtures', 'standings', 'admin'];
            tabs.forEach(t => {
                const el = document.getElementById(`view-${t}`);
                const btn = document.getElementById(`tab-${t}`);
                if (el) el.classList.add('hidden');
                if (btn) btn.classList.remove('nav-item-active');
            });

            document.getElementById(`view-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('nav-item-active');
        };

        window.showToast = function(msg, flavor = "green") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-lg shadow-xl text-xs font-bold tracking-wide border bg-black text-white ${flavor === 'green' ? 'border-emerald-500' : 'border-pink-500'} pointer-events-auto transition duration-300`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 4000);
        };

        // Realtime Firebase Stream Mapping Nodes
        onValue(ref(db, 'players'), (snapshot) => {
            globalPlayers = snapshot.val() || {};
            filterAndRenderMarket();
            if (currentRole === 'admin') renderAdminPanel();
        });

        onValue(ref(db, 'fixtures'), (snapshot) => {
            globalFixtures = snapshot.val() || {};
            populateMatchweekSelector();
            renderFixtures();
        });

        onValue(ref(db, 'managers'), (snapshot) => {
            globalManagers = snapshot.val() || {};
            renderStandings();
            if (currentUser && globalManagers[currentUser]) {
                document.getElementById('wallet-balance').innerText = Number(globalManagers[currentUser].balance).toLocaleString();
                renderPortfolio();
            }
        });

        // Berger Round Robin Scheduling Matrix Generation Algorithm
        window.generateRoundRobinFixtures = function() {
            if (!confirm("Are you sure you want to completely re-schedule and generate all 38 Round Robin matchweeks?")) return;
            
            let teams = [...PREM_TEAMS];
            let numTeams = teams.length;
            let totalRounds = (numTeams - 1) * 2;
            let matchesPerRound = numTeams / 2;
            let fixturesRef = {};

            let fixCount = 0;
            for (let round = 0; round < totalRounds; round++) {
                let mw = round + 1;
                for (let match = 0; match < matchesPerRound; match++) {
                    let home = (round + match) % (numTeams - 1);
                    let away = (numTeams - 1 - match + round) % (numTeams - 1);
                    if (match === 0) away = numTeams - 1;

                    if (round >= numTeams - 1) {
                        let temp = home; home = away; away = temp;
                    }

                    let homeTeam = teams[home];
                    let awayTeam = teams[away];
                    let id = `f_rr_${Date.now()}_${fixCount++}`;

                    fixturesRef[id] = {
                        homeTeam, awayTeam, matchweek: mw,
                        date: "2026-09-12", time: "15:00",
                        commentary: "Fixture logged on schedule board.",
                        homeScore: 0, awayScore: 0
                    };
                }
            }

            set(ref(db, 'fixtures'), fixturesRef).then(() => {
                showToast("🏆 38 Matchweeks structured successfully!", "green");
            });
        };

        function populateMatchweekSelector() {
            const selector = document.getElementById('fixture-mw-selector');
            const currentSelected = selector.value;
            selector.innerHTML = '';

            let mws = new Set();
            Object.values(globalFixtures).forEach(f => { if(f.matchweek) mws.add(f.matchweek); });
            
            let sortedMws = Array.from(mws).sort((a,b) => a - b);
            if(sortedMws.length === 0) {
                selector.innerHTML = `<option value="1">Matchweek 1</option>`;
                return;
            }

            sortedMws.forEach(mw => {
                selector.innerHTML += `<option value="${mw}">Matchweek ${mw}</option>`;
            });

            if(currentSelected && mws.has(parseInt(currentSelected))) {
                selector.value = currentSelected;
            } else {
                selector.value = sortedMws;
            }
        }

        // Marketplace Rendering Layout Builders
        window.filterAndRenderMarket = function() {
            const searchVal = document.getElementById('search-player').value.toLowerCase();
            const sorting = document.getElementById('filter-price').value;
            const marketGrid = document.getElementById('market-grid');
